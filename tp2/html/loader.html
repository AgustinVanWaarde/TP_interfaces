<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/Header.css">
    <link rel="stylesheet" href="../css/CarrouselAndCardsHome.css">
    <link rel="stylesheet" href="../css/Footer.css">
    <link rel="stylesheet" href="../css/Login.css">
    <link rel="stylesheet" href="../css/Loader.css">
    <link rel="stylesheet" href="../css/boton.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Jersey+15&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Document</title>
</head>
<body>
    

    <header>
        <nav class="grid-navbar">
            <!-- Hamburguesa izquierda -->
            <div class="menu-hamburguesa">
                <img id="btn-hamburguesa" src="../imgs/menuHamburguesa.png" alt="menu hamburguesa">
                <nav class="opciones-menu-hamburguesa opciones-menu-hamburguesa-oculto">
                    <h2>Categorias:</h2>
                    <a href="#">Inicio</a>
                    <a href="#">Accion</a>
                    <a href="#">Aventura</a>
                    <a href="#">RPG</a>
                </nav>
            </div>
            
            <!-- Título central (Retro + Logo + Games) -->
            <div class="titulo-grupo">
                <div class="titulo">
                    <h1>Retro</h1>
                </div>
                <div class="titulo">
                    <img src="../imgs/logo.png" alt="logo">
                </div>
                <div class="titulo">
                    <h1>Games</h1>
                </div>
            </div>
            
            <!-- Botones derecha (Ayuda + Perfil) -->
            <div class="botones-derecha">
                <div class="menu-ayuda">
                    <img src="../imgs/botonAyuda.png" alt="botonAyuda">
                </div>
                <div class="menu-perfil">
                    <img id="btn-perfil" src="../imgs/botonPerfil.png" alt="botonPerfil">
                    <nav class="opciones-perfil">
                        <div class="grupo-perfil">
                            <div class="perfil-info">
                                <img src="../imgs/fotoPerfil.png" alt="botonPerfil">
                                <span class="nombre-usuario">Usuario123</span>
                            </div>
                            <a class="opcion-perfil" href="#">Perfil</a>
                            <a class="opcion-perfil" href="#">Configuracion</a>
                            <a class="opcion-perfil" href="#">Soporte</a>
                        </div>
                        <div class="grupo-cerrar-sesion">
                            <a id="btn-cerrar-sesion" class="opcion-perfil" href="#">Cerrar Sesion</a>
                        </div>
                    </nav>
                </div>
            </div>
        </nav>
    </header>

        <!-- Botón derecha (siguiente) -->
    <button class="boton-carrusel boton-siguiente">
        <div class="flecha-pixel flecha-derecha"></div>
    </button>

    <!-- Botón izquierda (anterior) -->
    <button class="boton-carrusel boton-anterior">
        <div class="flecha-pixel flecha-izquierda"></div>
    </button>


    <script src="../js/loader.js"></script>
    <script src="../js/menus.js"></script>    
</body>
</html>
